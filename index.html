<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Speed Slides</title>
<style>
  :root { --bg: #f8f6f1; --ink: #1d222b; --muted: #4a5260; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .stage img { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; display: block; user-select: none; }
  .hud { position: fixed; right: 16px; bottom: 12px; display: flex; gap: 8px; align-items: center;
    color: var(--muted); transition: opacity .3s; }
  .hud button { font: inherit; border: 1px solid #d8d3c8; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  body.idle .hud { opacity: 0; }
</style>
</head>
<body>
<div class="stage"><img id="slide" alt="Slide 1" src="slides/1.png"></div>
<div class="hud">
  <button type="button" id="prev" aria-label="Previous slide">‹</button>
  <span id="count">1 / 14</span>
  <button type="button" id="next" aria-label="Next slide">›</button>
  <button type="button" id="full">Full screen</button>
</div>
<script>
// 6 submitted slides, then the Q&A index (7) and backups B1–B7 (8–14). Keys: arrows, space, PageUp/Down (clickers),
// F for full screen, or type a page number and press Enter to jump (e.g. 8 Enter).
const N = 14, img = document.getElementById("slide"), count = document.getElementById("count");
for (let i = 2; i <= N; i++) new Image().src = `slides/${i}.png`;      // preload
let cur = Math.min(N, Math.max(1, parseInt(location.hash.slice(1)) || 1));
function show(i) {
  cur = Math.min(N, Math.max(1, i));
  img.src = `slides/${cur}.png`; img.alt = `Slide ${cur}`;
  count.textContent = `${cur} / ${N}`;
  history.replaceState(null, "", `#${cur}`);
}
const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("full").onclick = fullscreen;
let buf = "", bufT;
document.addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) { buf += e.key; count.textContent = `→ ${buf}`; clearTimeout(bufT); bufT = setTimeout(() => { buf = ""; show(cur); }, 2000); return; }
  if (e.key === "Enter" && buf) { e.preventDefault(); const k = +buf; buf = ""; show(k); return; }
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(1);
  else if (e.key === "End") show(N);
  else if (e.key === "f" || e.key === "F") fullscreen();
});
document.querySelector(".stage").addEventListener("click", e => show(cur + (e.clientX > innerWidth / 2 ? 1 : -1)));
let x0 = null;
addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
});
let t; addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => document.body.classList.add("idle"), 2000); });
show(cur);
</script>
</body>
</html>
